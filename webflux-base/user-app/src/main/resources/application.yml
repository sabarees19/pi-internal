server:
  port: 8082

spring:
  application:
    name: user-app
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/user
    username: postgres
    password: postgres
    sql:
      init:
        mode: always

user:
  dbConfig: update
  jobs:
    enabled: false
  gateway:
    url: http://localhost:8083

messages:
  basename: message
  fallback-to-system-locale: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost